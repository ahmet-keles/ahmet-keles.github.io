# Builds the Vite/React portfolio and publishes it to GitHub Pages.
#
# NOTE: this repository's Pages source must be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). The served site is
# the build output in dist/, which is not committed to the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue behind the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Quality gate. Runs on pull requests too, so a broken branch is visible
  # before it reaches main — but only pushes to main go on to deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # `npm run build` type-checks again, builds with Vite, then copies
      # index.html to 404.html so client-side routes survive a direct hit.
      - name: Build
        run: npm run build

      - name: Verify SPA fallback exists
        run: test -f dist/404.html && test -f dist/index.html

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
